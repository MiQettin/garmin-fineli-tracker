<div class="card metric-card">
  <div class="metric-card-top">
    <span class="metric-card-label">{{ label }}</span>
    <span class="metric-card-date" id="{{ prefix }}-current-date"></span>
  </div>
  <div class="metric-card-current" id="{{ prefix }}-current">—</div>
  <div class="metric-card-delta" id="{{ prefix }}-delta">—</div>
  <div class="metric-card-avgs">
    <span class="avg-chip">7d <b id="{{ prefix }}-avg7">—</b></span>
    <span class="avg-chip">28d <b id="{{ prefix }}-avg28">—</b></span>
    <span class="avg-chip">90d <b id="{{ prefix }}-avg90">—</b></span>
  </div>
  <div class="metric-card-counts" id="{{ prefix }}-counts"></div>
</div>
